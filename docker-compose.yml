services:
  api:
    build: .
    ports: ["8000:8000"]
    volumes:
      - ./models:/models          # trained memory bank + cached backbone weights
      - inspection-data:/data
    environment:
      MODEL_DIR: /models/patchcore/bottle
  dashboard:
    build: { context: ., dockerfile: Dockerfile.dashboard }
    ports: ["8501:8501"]
    environment:
      API_URL: http://api:8000
    depends_on: [api]
volumes:
  inspection-data:
